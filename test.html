<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User CRUD UI</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: auto; }
    section { margin-bottom: 30px; }
    input { padding: 6px; margin: 4px; }
    button { padding: 6px 12px; margin: 4px; }
    .user-list { margin-top: 10px; padding-left: 20px; }
  </style>
</head>
<body>

  <h1>User CRUD Interface</h1>

  <!-- Display Users -->
  <section>
    <h2>Display Users</h2>
    <button onclick="fetchUsers()">Refresh</button>
    <ul id="userList" class="user-list"></ul>
  </section>

  <!-- Create User -->
  <section>
    <h2>Create User</h2>
    <input type="text" id="createName" placeholder="Enter name" />
    <button onclick="createUser()">Enter</button>
  </section>

  <!-- Update User -->
  <section>
    <h2>Update User</h2>
    <input type="text" id="updateId" placeholder="Enter user ID" />
    <input type="text" id="updateName" placeholder="New name" />
    <button onclick="updateUser()">Update</button>
  </section>

  <!-- Delete User -->
  <section>
    <h2>Delete User</h2>
    <input type="text" id="deleteId" placeholder="Enter user ID" />
    <button onclick="deleteUser()">Delete</button>
  </section>

  <script>
    const api = 'https://betcha-api.onrender.com/test';

    async function fetchUsers() {
      try {
        const res = await fetch(api);
        const users = await res.json();
        const list = document.getElementById('userList');
        list.innerHTML = '';
        users.forEach(user => {
          const li = document.createElement('li');
          li.textContent = `ID: ${user._id} | Name: ${user.name}`;
          list.appendChild(li);
        });
      } catch (err) {
        alert('Failed to fetch users.');
        console.error(err);
      }
    }

    async function createUser() {
      const name = document.getElementById('createName').value;
      if (!name) return alert('Enter a name!');
      try {
        const res = await fetch(api, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name })
        });
        if (res.ok) {
          alert('User created successfully!');
          fetchUsers();
        } else {
          alert('Failed to create user.');
        }
      } catch (err) {
        alert('Error occurred during user creation.');
        console.error(err);
      }
      document.getElementById('createName').value = '';
    }

    async function updateUser() {
      const id = document.getElementById('updateId').value;
      const name = document.getElementById('updateName').value;
      if (!id || !name) return alert('Enter both ID and new name!');
      try {
        const res = await fetch(`${api}/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name })
        });
        if (res.ok) {
          alert('User updated successfully!');
          fetchUsers();
        } else {
          alert('Failed to update user.');
        }
      } catch (err) {
        alert('Error occurred during update.');
        console.error(err);
      }
      document.getElementById('updateId').value = '';
      document.getElementById('updateName').value = '';
    }

    async function deleteUser() {
      const id = document.getElementById('deleteId').value;
      if (!id) return alert('Enter ID to delete!');
      try {
        const res = await fetch(`${api}/${id}`, { method: 'DELETE' });
        if (res.ok) {
          alert('User deleted successfully!');
          fetchUsers();
        } else {
          alert('Failed to delete user.');
        }
      } catch (err) {
        alert('Error occurred during deletion.');
        console.error(err);
      }
      document.getElementById('deleteId').value = '';
    }

    fetchUsers();
  </script>

</body>
</html>
