<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Betcha Ticket</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #313338;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .chat-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 600px;
      margin: 0 auto;
      background: #2b2d31;
      padding: 20px;
    }

    .chat-header {
      display: flex;
      flex-direction: column;
      gap: 10px;
      color: white;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .circular-progress {
      width: 50px;
      height: 50px;
    }

    .progress-ring {
      transform: rotate(-90deg);
    }

    .progress-ring__circle {
      stroke: #00bfff;
      stroke-width: 5;
      fill: transparent;
      stroke-dasharray: 125.6;
      stroke-dashoffset: 125.6;
      transition: stroke-dashoffset 0.1s linear;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding-right: 5px;
      margin: 10px 0;
    }

    .message {
      margin-bottom: 20px;
      padding: 10px;
      background: #404249;
      border-radius: 8px;
    }

    .message .meta {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 5px;
    }

    .message .text {
      font-size: 14px;
      color: #fff;
    }

    .form {
      display: flex;
      gap: 10px;
    }

    .form textarea {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 4px;
      resize: none;
    }

    .form button {
      background: #5865f2;
      color: white;
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .form button:hover {
      background: #4752c4;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <h2>🎫 Ticket #<span id="ticketNumber">Loading...</span></h2>
      <div class="top-bar">
        <button id="refreshBtn" onclick="loadTicket()">🔄 Refresh</button>
        <div class="circular-progress">
          <svg class="progress-ring" width="50" height="50">
            <circle class="progress-ring__circle" r="20" cx="25" cy="25"/>
          </svg>
        </div>
      </div>
    </div>

    <div id="messages"></div>

    <div class="form">
      <textarea id="replyText" placeholder="Type your reply..."></textarea>
      <button onclick="sendReply()">Send</button>
    </div>
  </div>

  <script>
    const ticketId = '68618cb8e9930e8a53d2a7a6';
    const userId = '686187f1b3d2f683d4d2c3d0';
    const userLevel = 'employee';

    async function loadTicket() {
      const res = await fetch(`https://betcha-api.onrender.com/tk/${ticketId}`);
      const data = await res.json();

      document.getElementById('ticketNumber').innerText = data.ticket.ticketNumber;
      const messagesContainer = document.getElementById('messages');
      messagesContainer.innerHTML = '';

      data.ticket.messages.forEach(msg => {
        const dateTimePH = msg.phTime || new Date(msg.dateTime).toLocaleString('en-PH', { timeZone: 'Asia/Manila' });
        const div = document.createElement('div');
        div.className = 'message';
        div.innerHTML = `
          <div class="meta"><strong>${msg.userName}</strong> • ${msg.userLevel} • ${dateTimePH}</div>
          <div class="text">${msg.message}</div>
        `;
        messagesContainer.appendChild(div);
      });

      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    async function sendReply() {
      const message = document.getElementById('replyText').value.trim();
      if (!message) return;

      try {
        const res = await fetch(`https://betcha-api.onrender.com/tk/reply/${ticketId}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId, userLevel, message })
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.message || 'Reply failed');
        }

        document.getElementById('replyText').value = '';
        await loadTicket();
      } catch (err) {
        alert("Failed to send reply: " + err.message);
        console.error(err);
      }
    }

    // Auto-refresh with circular progress
    const circle = document.querySelector('.progress-ring__circle');
    const radius = circle.r.baseVal.value;
    const circumference = 2 * Math.PI * radius;
    circle.style.strokeDasharray = `${circumference}`;
    circle.style.strokeDashoffset = `${circumference}`;

    let progress = 0;
    const refreshInterval = 3; // ← changed from 5 to 3 seconds

    function updateCircularProgress() {
    progress += 0.1;
    const offset = circumference - (progress / refreshInterval) * circumference;
    circle.style.strokeDashoffset = offset;

    if (progress >= refreshInterval) {
        loadTicket();
        progress = 0;
        circle.style.strokeDashoffset = circumference;
    }
    }

    setInterval(updateCircularProgress, 100);

    loadTicket();
  </script>
</body>
</html>
